        # # 图片资源缓存
        # location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        #     proxy_pass http://172.17.186.22:3000;
        #     proxy_cache_valid 200 7d;
        #     add_header Cache-Control "public, max-age=604800";
        # }

        # # 上传文件大小限制
        # client_max_body_size 10M;
    }

    # http节点中可以添加多个server节点
    server {
        # 监听443端口
        listen 443 ssl;
        # 对应域名
        server_name localhost;
        # ssl on;
        ssl_certificate /etc/ssl/certificate.crt;
        ssl_certificate_key /etc/ssl/private.key;
        # ssl_certificate /etc/ssl/maiqishare.xyz.pem;
        # ssl_certificate_key /etc/ssl/maiqishare.xyz.key;
        ssl_session_timeout 5m;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
        ssl_prefer_server_ciphers on;

        location / {
            root   /www/html;
            index  index.html index.htm;
        }

        location /api {
            proxy_pass http://localhost:4000/api;
        }

        location /room-api {
            proxy_pass http://localhost:5000/room-api;
        }

        location /open-api {
            proxy_pass http://localhost:3100/open-api;
        }

        location /cron-api {
            proxy_pass http://localhost:3200/cron-api;
        }

        # # Next.js应用配置
